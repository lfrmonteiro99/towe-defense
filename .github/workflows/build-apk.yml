name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & upload APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle) ─────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      # ── 4. Dependencies ──────────────────────────────────────────────────────
      - name: Install pub dependencies
        run: flutter pub get

      # ── 5. (Optional) Run tests ───────────────────────────────────────────────
      - name: Run tests
        run: flutter test --no-pub
        continue-on-error: true   # don't fail the pipeline if no tests exist yet

      # ── 6. Build debug APK (always works, no keystore needed) ─────────────────
      - name: Build debug APK
        run: flutter build apk --debug

      # ── 7. Build release APK (signed when secrets are present) ────────────────
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Build release APK (signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: android/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK (unsigned fallback)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: flutter build apk --release

      # ── 8. Upload APKs as artifacts ───────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tower-defense-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tower-defense-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # ── 9. Create GitHub Release on version tags ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true
